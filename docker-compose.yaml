version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: url_shortener_redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: user_service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=${USER_SERVICE_DB_URL} 
      - JWT_SECRET=${JWT_SECRET_KEY}
    depends_on:
      - redis
    networks:
      - app-network

  url-service:
    build:
      context: ./services/url-service
      dockerfile: Dockerfile
    container_name: url_service
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=${URL_SERVICE_DB_URL}   
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET_KEY}
    depends_on:
      - redis
    networks:
      - app-network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: api_gateway
    ports:
      - "80:80" 
    depends_on:
      - user-service
      - url-service
    networks:
      - app-network

networks:
  app-network:
    driver: bridge